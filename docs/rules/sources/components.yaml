version: 1
components:
- name: Frontend
  title: 프론트
  kind: 외부 접점
  responsibility: 사용자 말을 STT로 글자로 바꿔 보내고, 응답 문장을 TTS로 읽어 준다.
  why: 사용자와 닿는 유일한 곳. 시스템 밖이며 받는 값·내는 값만 정한다.
  id: frontend
  contracts:
    input: FrontendInput
    output: FrontendMessage
- name: Staff Console
  title: 사람 개입
  kind: 외부 접점
  responsibility: 직원·의료진에게 알림을 보여 주고, 그들의 결정(재개·종료)을 보낸다.
  why: 위험(G1)·직원 요청(F1)에 사람이 와야 하고, 멈춘 문진은 사람만 이어 가거나 끝낼 수 있다.
  id: staff_console
  contracts:
    input: StaffConsoleInput
    output: InterventionDecision
- name: Orchestrator
  title: LangGraph
  kind: 흐름 제어
  responsibility: 한 턴의 순서대로 컴포넌트를 부르고, 저장소에서 정해진 범위를 가져와 건네고, 쓰기를 저장소에 전달한다.
  why: 컴포넌트가 저장소를 직접 읽으면 무엇에 의존하는지가 코드 안에 숨고 혼자 시험할 수 없다. 읽기·쓰기 순서를 한 곳에서 지켜야 한 턴 안에서 어긋나지 않는다.
  id: orchestrator
  contracts:
    input: OrchestratorInput
    output: OrchestratorOutput
    trace: TurnTrace
- name: Utterance Parser
  title: LoRA-A
  kind: 모델
  responsibility: 사용자 발화를 (대상, 값, 원문, 의도) 항목들로 바꾼다.
  why: 자연어 해석만 모델이 하고 판단은 코드가 한다(역할 분리 원칙).
  id: utterance_parser
  contracts:
    input: UtteranceParserInput
    output: ParserOutput
- name: Answer Normalizer
  title: 정규화·검증
  kind: 코드
  responsibility: 항목 값을 표준 형태로 바꾸고, 규칙 위반·기존 값과의 같음/다름·빠진 필수 슬롯·선행 조건을 사실로 표시한다.
  why: 값 규칙(단위·범위·선행 조건)이 바뀌면 이곳만 바뀐다.
  id: answer_normalizer
  status: "보관(v1): 2026-10-28 D99, 참조 제거 후 다음 릴리스에서 삭제"
  contracts:
    input: AnswerNormalizerInput
    output: NormalizerOutput
- name: Answer Judge
  title: 상태 판정
  kind: 코드
  responsibility: 이번 발화가 각 대상에 대해 무엇을 뜻하는지(정상·정정·충돌·누락 등) 판정한다.
  why: 해석 규칙(충돌·정정·확인 응답)이 바뀌면 이곳만 바뀐다. 저장 판단보다 먼저 있어야 한다(상태 판정 결과를 저장 판단보다 먼저 전달하는 순서).
  id: answer_judge
  status: "보관(v1): 2026-10-28 D99, 참조 제거 후 다음 릴리스에서 삭제"
  contracts:
    input: AnswerJudgeInput
    output: JudgeOutput
- name: Record Writer
  title: 저장 판단
  kind: 코드
  responsibility: 판정을 응답 기록에 어떻게 반영할지 슬롯별로 정한다.
  why: 저장소가 판단 없이 반영하게 하려면 무엇을 할지가 다 정해져 있어야 한다.
  id: record_writer
  status: "보관(v1): 2026-10-28 D99, 참조 제거 후 다음 릴리스에서 삭제"
  contracts:
    input: RecordWriterInput
    output: StoreResult
- name: Dialogue Planner
  title: Plan 결정
  kind: 코드
  responsibility: 다음에 무엇을 말할지 정하고, 그 말에 필요한 값과 문장 재료를 담은 응답 지시를 만든다.
  why: 대화 정책이 바뀌면 이곳만 바뀐다. 진행 기록·Plan 기록을 쓰는 유일한 곳.
  id: dialogue_planner
  status: "보관(v1): 2026-10-28 D99, 참조 제거 후 다음 릴리스에서 삭제"
  contracts:
    input: DialoguePlannerInput
    output: PlannerOutput
- name: Response Generator
  title: LoRA-B
  kind: 모델
  responsibility: 응답 지시를 사용자 발화에 맞춰 받아 주며 자연스러운 문장으로 바꾼다.
  why: 문장만 모델이 만들고 무엇을 말할지는 정하지 않는다(역할 분리 원칙).
  id: response_generator
  contracts:
    input: ResponseGeneratorInput
    output: GeneratorOutput
- name: Result Dispatcher
  title: 결과 전달
  kind: 외부 접점(붙을 예정)
  responsibility: 확정된 문진 결과를 시스템 밖으로 넘긴다.
  why: 확정된 문진 결과를 외부 수신처에 전달하고 전달 성공·실패를 기록하기 위해, 결과 전달의 입력과 출력 경계를 구분한다.
  id: result_dispatcher
  contracts:
    input: DispatchInput
    output: DispatchOutput
- name: Question Bank
  title: 문항 정의 저장소
  kind: 저장소
  responsibility: 문진 설계자가 등록한 문항 정의를 버전별로 읽기 전용으로 보관한다.
  why: 문항을 코드 밖에 두어 문항을 바꿔도 코드가 바뀌지 않는다.
  id: question_bank
  contracts:
    state: QuestionBank
- name: Session Store
  title: 기록 저장소
  kind: 저장소
  responsibility: 세션별 응답 기록·진행 기록·Plan 기록·세션 정보·로그를 보관하고, 받은 쓰기를 정해진 효과대로 반영한다.
  why: 턴 사이에 이어져야 하는 사실을 둔다.
  id: session_store
  contracts:
    state: SessionStore
    load_request: SessionLoadRequest
    load_result: SessionLoadResult
    commit_request: SessionCommitRequest
    commit_result: SessionCommitResult
  contract_status:
    load_request: proposal
    load_result: proposal
    commit_request: proposal
    commit_result: proposal
