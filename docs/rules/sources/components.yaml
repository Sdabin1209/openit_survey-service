version: 1
components:
- name: Frontend
  title: 프론트
  kind: 외부 접점
  responsibility: 사용자 말을 STT로 글자로 바꿔 보내고, 응답 문장을 TTS로 읽어 준다.
  why: 사용자와 닿는 유일한 곳. 시스템 밖이며 받는 값·내는 값만 정한다.
  id: frontend
  contracts:
    input: FrontendInput
    output: FrontendMessage
- name: Staff Console
  title: 사람 개입
  kind: 외부 접점
  responsibility: 직원·의료진에게 알림을 보여 주고, 그들의 결정(재개·종료)을 보낸다.
  why: 위험(G1)·직원 요청(F1)에 사람이 와야 하고, 멈춘 문진은 사람만 이어 가거나 끝낼 수 있다.
  id: staff_console
  contracts:
    input: StaffConsoleInput
    output: InterventionDecision
- name: Orchestrator
  title: LangGraph
  kind: 흐름 제어
  responsibility: 한 턴의 순서대로 컴포넌트를 부르고, 저장소에서 정해진 범위를 가져와 건네고, 쓰기를 저장소에 전달한다.
  why: 컴포넌트가 저장소를 직접 읽으면 무엇에 의존하는지가 코드 안에 숨고 혼자 시험할 수 없다. 읽기·쓰기 순서를 한 곳에서 지켜야 한 턴
    안에서 어긋나지 않는다.
  id: orchestrator
  contracts:
    input: OrchestratorInput
    output: OrchestratorOutput
    trace: TurnTrace
- name: Result Dispatcher
  title: 결과 전달
  kind: 외부 접점(붙을 예정)
  responsibility: 확정된 문진 결과를 시스템 밖으로 넘긴다.
  why: 확정된 문진 결과를 외부 수신처에 전달하고 전달 성공·실패를 기록하기 위해, 결과 전달의 입력과 출력 경계를 구분한다.
  id: result_dispatcher
  contracts:
    input: DispatchInput
    output: DispatchOutput
- name: Question Bank
  title: 문항 정의 저장소
  kind: 저장소
  responsibility: 문진 설계자가 등록한 문항 정의를 버전별로 읽기 전용으로 보관한다.
  why: 문항을 코드 밖에 두어 문항을 바꿔도 코드가 바뀌지 않는다.
  id: question_bank
  contracts:
    state: QuestionBank
- name: Session Store
  title: 기록 저장소
  kind: 저장소
  responsibility: 세션별 응답 기록·진행 기록·Plan 기록·세션 정보·로그를 보관하고, 받은 쓰기를 정해진 효과대로 반영한다.
  why: 턴 사이에 이어져야 하는 사실을 둔다.
  id: session_store
  contracts:
    state: SessionStore
    load_request: SessionLoadRequest
    load_result: SessionLoadResult
    commit_request: SessionCommitRequest
    commit_result: SessionCommitResult
  contract_status:
    load_request: proposal
    load_result: proposal
    commit_request: proposal
    commit_result: proposal
