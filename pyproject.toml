[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openit-survey-service"
version = "0.2.0"
description = "openit 문진 서비스: Orchestrator, Session Store, 릴리스 로더, Trace 내보내기."
requires-python = ">=3.10"
dependencies = ["langgraph>=1.2,<1.3", "pywebpush>=2.5,<3", "jsonschema>=4.10", "boundary-contracts", "model-runtime", "openit-survey-schema", "psycopg[binary]==3.3.6"]

[tool.setuptools]
packages = ["survey_service", "survey_service.store", "survey_service.release", "survey_service.trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:jsonschema.RefResolver is deprecated:DeprecationWarning"]
