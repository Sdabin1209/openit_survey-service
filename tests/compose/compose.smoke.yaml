# 서비스 이미지 + 추론 이미지(가짜 경로, 모델 없음) + 가짜 게이트/수집 서버를 같이 띄운다. 호스트 포트는 Docker가 배정한다.
# 변수: SERVICE_IMAGE, FAKE_IMAGE (scripts/smoke_compose.sh가 정한다). 토큰은 시험용 값이다.
services:
  gate:
    image: ${FAKE_IMAGE}
    command: ["python", "-m", "tests.ref_gate_main"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 15
  inference:
    image: ${FAKE_IMAGE}
    command: ["python", "-m", "tests.ref_inference_server"]
    environment:
      INFERENCE_TOKEN: smoke-inference-token
      INFERENCE_PORT: "8081"
      SURVEY_MODEL_BACKEND: fake
      SURVEY_WORK_DIR: /data/releases
      SURVEY_RELEASE_READER: http
      SURVEY_RELEASE_READER_URL: http://gate:9000
      SURVEY_RELEASE_READER_TOKEN_ENV: GATE_READ_TOKEN
      GATE_READ_TOKEN: r-tok
    depends_on:
      gate: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/readyz')"]
      interval: 2s
      timeout: 3s
      retries: 15
  service:
    image: ${SERVICE_IMAGE}
    ports: ["127.0.0.1::8080"]
    environment:
      SURVEY_RELEASE_READER: http
      SURVEY_RELEASE_READER_URL: http://gate:9000
      SURVEY_RELEASE_READER_TOKEN_ENV: GATE_READ_TOKEN
      GATE_READ_TOKEN: r-tok
      SURVEY_TRACE_INGEST: http
      SURVEY_TRACE_INGEST_URL: http://gate:9000
      SURVEY_TRACE_INGEST_TOKEN_ENV: GATE_WRITE_TOKEN
      GATE_WRITE_TOKEN: w-tok
      SURVEY_INFERENCE_URL: http://inference:8081
      SURVEY_INFERENCE_TOKEN_ENV: INFERENCE_CLIENT_TOKEN
      INFERENCE_CLIENT_TOKEN: smoke-inference-token
      SURVEY_INFERENCE_TIMEOUT_SECONDS: "3"
      SURVEY_API_TOKEN: smoke-api-token
      SURVEY_STAFF_API_TOKEN: smoke-staff-token
      SURVEY_RELEASE_POLL_SECONDS: "1"
      SURVEY_EXPORT_INTERVAL_SECONDS: "0.5"
    depends_on:
      inference: {condition: service_healthy}
