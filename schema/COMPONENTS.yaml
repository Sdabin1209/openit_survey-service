version: 1
components:
- name: Frontend
  title: 프론트
  kind: 외부 접점
  responsibility: 사용자 말을 STT로 글자로 바꿔 보내고, 응답 문장을 TTS로 읽어 준다.
  why: 사용자와 닿는 유일한 곳. 시스템 밖이며 받는 값·내는 값만 정한다.
  id: frontend
  contracts:
    input: FrontendInput
    output: FrontendMessage
- name: Staff Console
  title: 사람 개입
  kind: 외부 접점
  responsibility: 직원·의료진에게 알림을 보여 주고, 그들의 결정(재개·종료)을 보낸다.
  why: 위험(G1)·직원 요청(F1)에 사람이 와야 하고, 멈춘 문진은 사람만 이어 가거나 끝낼 수 있다.
  id: staff_console
  contracts:
    input: StaffConsoleInput
    output: InterventionDecision
    view: StaffSessionView
- name: Orchestrator
  title: LangGraph
  kind: 흐름 제어
  responsibility: 한 턴의 순서대로 컴포넌트를 부르고, 저장소에서 정해진 범위를 가져와 건네고, 쓰기를 저장소에 전달한다.
  why: 컴포넌트가 저장소를 직접 읽으면 무엇에 의존하는지가 코드 안에 숨고 혼자 시험할 수 없다. 읽기·쓰기 순서를 한 곳에서 지켜야 한 턴 안에서 어긋나지 않는다.
  id: orchestrator
  contracts:
    input: OrchestratorInput
    output: OrchestratorOutput
    trace: TurnTrace
- name: Action Extractor
  title: LoRA-A
  kind: 모델
  responsibility: 사용자 발화를 값 추출, 정규화, 절차(action), 다음 문항으로 한 번에 바꾼다. 입력과 출력은 boundary-contracts의 ActionExtractionInput, ActionExtraction이다(D74).
  why: 해석과 정규화를 모델이 하고 코드는 검증과 저장만 한다. 세션 시작은 이 모델을 부르지 않는다.
  id: action_extractor
  contracts:
    input: ActionExtractionInput (boundary-contracts)
    output: ActionExtraction (boundary-contracts)
- name: Extraction Validator
  title: 출력 검증
  kind: 코드
  responsibility: turn-engine의 validate_extraction으로 A 출력의 의미(targets, next_item, 건너뛰기, save 규칙)를 검증한다. 문항 순서·건너뛰기 표(QuestionFlow)는 이 영역이 문진 스키마에서 만들어 넘긴다(D76).
  why: 위반 출력은 값을 지어내지 않고 한 번 재시도한 뒤 턴 실패로 처리한다(D75).
  id: extraction_validator
  contracts:
    table: QuestionFlow
- name: Response Composer
  title: LoRA-B
  kind: 모델
  responsibility: 서비스가 표 찾기로 조립한 ResponseRequest(known, ask, previous, current, hold, topic, next)를 사용자에게 할 문장으로 바꾼다(text/plain).
  why: 문장만 모델이 만든다. 문항 질문 문장, 칸 설명, ask 문장 틀은 서비스가 표에서 찾는다(ResponseTables, 미확정 초안).
  id: response_composer
  contracts:
    input: ResponseRequest (boundary-contracts)
    output: ResponseText (boundary-contracts)
    table: ResponseTables
- name: Result Dispatcher
  title: 결과 전달
  kind: 외부 접점(붙을 예정)
  responsibility: 확정된 문진 결과를 시스템 밖으로 넘긴다.
  why: 확정된 문진 결과를 외부 수신처에 전달하고 전달 성공·실패를 기록하기 위해, 결과 전달의 입력과 출력 경계를 구분한다.
  id: result_dispatcher
  contracts:
    input: DispatchInput
    output: DispatchOutput
- name: Question Bank
  title: 문항 정의 저장소
  kind: 저장소
  responsibility: 문진 설계자가 등록한 문항 정의를 버전별로 읽기 전용으로 보관한다.
  why: 문항을 코드 밖에 두어 문항을 바꿔도 코드가 바뀌지 않는다.
  id: question_bank
  contracts:
    state: QuestionBank
- name: Session Store
  title: 기록 저장소
  kind: 저장소
  responsibility: 세션별 응답 기록·진행 기록·Plan 기록·세션 정보·로그를 보관하고, 받은 쓰기를 정해진 효과대로 반영한다.
  why: 턴 사이에 이어져야 하는 사실을 둔다.
  id: session_store
  contracts:
    state: SessionStore
    load_request: SessionLoadRequest
    load_result: SessionLoadResult
    commit_request: SessionCommitRequest
    commit_result: SessionCommitResult
  contract_status:
    load_request: proposal
    load_result: proposal
    commit_request: proposal
    commit_result: proposal
